[metadata]
name = mochi-harness
version = 0.0.2
description = Bring-your-own-agents host harness for a safe physical terminal controller
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/vyl0xvoid/mochi-harness
author = Mochi Harness contributors
license = MIT
license_files = LICENSE
classifiers =
    Development Status :: 2 - Pre-Alpha
    License :: OSI Approved :: MIT License
    Operating System :: MacOS
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.9

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9
include_package_data = True

[options.packages.find]
where = src

[options.package_data]
mochi_harness.resources =
    *.json

[options.entry_points]
console_scripts =
    mochi-harness-doctor = mochi_harness.doctor:main
    mochi-harness-init = mochi_harness.init_config:main
